<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DrawNGuess Mobile Screens</title>
    <style>
      :root {
        color-scheme: light;
        /* Mirrored from src/index.css semantic primitives for this standalone demo. */
        --background: hsl(42 30% 97%);
        --foreground: hsl(220 18% 12%);
        --card: hsl(0 0% 100%);
        --primary: hsl(173 58% 28%);
        --primary-foreground: hsl(0 0% 100%);
        --primary-hover: hsl(173 58% 25%);
        --primary-soft: hsl(173 58% 28% / 0.12);
        --secondary: hsl(219 18% 91%);
        --secondary-hover: hsl(219 18% 86%);
        --muted: hsl(216 20% 93%);
        --muted-foreground: hsl(220 9% 42%);
        --accent: hsl(38 92% 55%);
        --border: hsl(216 18% 85%);
        --surface-elevated: hsl(42 30% 97% / 0.95);
        --draw: hsl(173 58% 28%);
        --guess: hsl(338 70% 44%);
        --guess-soft: hsl(338 70% 44% / 0.12);
        --success: hsl(155 72% 30%);
        --success-soft: hsl(155 72% 30% / 0.12);
        --warn: hsl(33 92% 40%);
        --warn-soft: hsl(33 92% 55% / 0.18);
        --shadow: 0 24px 70px hsl(220 18% 12% / 0.18);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, hsl(173 58% 28% / 0.12), transparent 34rem),
          linear-gradient(180deg, #ffffff 0, var(--background) 42rem);
        color: var(--foreground);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .prototype-shell {
        display: grid;
        grid-template-columns: minmax(260px, 320px) minmax(360px, 1fr);
        gap: 28px;
        width: min(1180px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0 32px;
      }

      .meta {
        align-self: start;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 10px 34px rgba(17, 24, 39, 0.08);
      }

      .meta-kicker {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .meta h1 {
        margin: 0;
        font-size: 2rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .meta-copy {
        margin: 10px 0 0;
        color: var(--muted-foreground);
        font-size: 0.95rem;
        line-height: 1.48;
      }

      .meta-section {
        margin-top: 20px;
      }

      .meta-label {
        display: block;
        margin: 0 0 8px;
        color: var(--muted-foreground);
        font-size: 0.73rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .screen-nav {
        display: grid;
        gap: 8px;
      }

      .screen-button,
      .role-button {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--foreground);
        font-weight: 850;
      }

      .screen-button {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        text-align: left;
      }

      .screen-button.active,
      .role-button.active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
      }

      .screen-index {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 50%;
        background: #eef2f7;
        color: #344054;
        font-size: 0.78rem;
        font-weight: 950;
      }

      .screen-button.active .screen-index {
        background: var(--primary);
        color: #fff;
      }

      .role-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .role-button {
        padding: 8px;
      }

      .notes {
        display: grid;
        gap: 8px;
        margin: 12px 0 0;
        padding: 12px;
        border-radius: 8px;
        background: var(--muted);
        color: var(--muted-foreground);
        font-size: 0.84rem;
        line-height: 1.38;
      }

      .phone-stage {
        display: grid;
        align-content: start;
        justify-items: center;
        gap: 12px;
      }

      .screen-title {
        width: min(100%, 430px);
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 850;
      }

      .phone {
        width: min(100%, 430px);
        aspect-ratio: 390 / 844;
        max-height: calc(100vh - 88px);
        overflow: hidden;
        border: 10px solid #101828;
        border-radius: 34px;
        background: var(--background);
        box-shadow: var(--shadow);
      }

      .phone-screen {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        background: var(--background);
      }

      .mobile-topbar {
        padding: 10px 16px 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-elevated);
      }

      .shell-header,
      .mobile-title-row,
      .compact-row,
      .footer-actions,
      .tool-row {
        display: flex;
        align-items: center;
      }

      .shell-header {
        gap: 8px;
        justify-content: space-between;
      }

      .home-button,
      .header-spacer {
        display: grid;
        width: 40px;
        min-width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--foreground);
      }

      .header-spacer {
        border-color: transparent;
        background: transparent;
      }

      .header-title {
        min-width: 0;
        flex: 1;
        text-align: center;
      }

      .mobile-title {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.55;
        letter-spacing: 0;
      }

      .mobile-subtitle {
        margin: -2px 0 0;
        color: var(--muted-foreground);
        font-size: 0.76rem;
        font-weight: 750;
        line-height: 1.2;
      }

      .subtle {
        margin: 6px 0 0;
        color: var(--muted-foreground);
        font-size: 0.86rem;
        line-height: 1.34;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        color: var(--muted-foreground);
        font-size: 0.76rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .chip.draw {
        border-color: #bfdbfe;
        border-color: hsl(173 58% 28% / 0.35);
        background: var(--primary-soft);
        color: var(--primary);
      }

      .chip.guess {
        border-color: #f9a8d4;
        background: var(--guess-soft);
        color: #9d174d;
      }

      .chip.done {
        border-color: #a7f3d0;
        background: var(--success-soft);
        color: #116244;
      }

      .mobile-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 18px;
      }

      .mobile-body.no-pad {
        padding: 0;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        box-shadow: 0 1px 2px hsl(220 18% 12% / 0.05);
      }

      .panel + .panel,
      .stack > * + * {
        margin-top: 10px;
      }

      .panel-inner {
        padding: 14px;
      }

      .panel h2,
      .panel h3 {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.35;
      }

      .room-code {
        display: grid;
        min-height: 110px;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, hsl(173 58% 28% / 0.12), transparent), #fff;
        text-align: center;
      }

      .room-code strong {
        display: block;
        font-size: 2.65rem;
        line-height: 0.95;
        letter-spacing: 0.08em;
      }

      .player-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .player-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: center;
        min-height: 48px;
        padding: 7px;
        border: 1px solid var(--muted);
        border-radius: 8px;
        background: #fff;
      }

      .avatar {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: var(--foreground);
        color: #fff;
        font-size: 0.82rem;
        font-weight: 950;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .player-name {
        overflow: hidden;
        font-size: 0.9rem;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-meta {
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 750;
      }

      .setting-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 11px 0;
        border-top: 1px solid var(--muted);
      }

      .setting-row:first-of-type {
        margin-top: 8px;
      }

      .setting-value {
        min-width: 88px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
        font-size: 0.82rem;
        font-weight: 900;
        text-align: center;
      }

      .name-input {
        width: 100%;
        min-height: 52px;
        margin-top: 12px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--foreground);
        font-size: 1rem;
        font-weight: 800;
      }

      .avatar-preview {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .avatar-preview .avatar {
        width: 76px;
        height: 76px;
      }

      .assignment-avatar,
      .book-avatar {
        width: 48px;
        height: 48px;
      }

      .avatar-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .avatar-option {
        display: grid;
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 999px;
        background: #fff;
        padding: 0;
      }

      .avatar-option.active {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .avatar-option img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .settings-toggle {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--foreground);
        text-align: left;
      }

      .settings-toggle strong,
      .settings-toggle span {
        display: block;
      }

      .settings-chevron {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #fff;
        font-weight: 900;
      }

      .mode-toggle {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .mode-option {
        min-height: 52px;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--foreground);
        text-align: left;
      }

      .mode-option.active {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .mode-option strong,
      .mode-option span {
        display: block;
      }

      .footer-actions {
        gap: 9px;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface-elevated);
      }

      .primary,
      .secondary,
      .danger,
      .icon-button {
        min-height: 44px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-weight: 700;
      }

      .primary,
      .secondary,
      .danger {
        flex: 1;
        padding: 0 12px;
      }

      .primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .secondary {
        background: #fff;
        color: var(--foreground);
      }

      .danger {
        border-color: #fecaca;
        background: #fff1f2;
        color: #b42318;
      }

      .icon-button {
        display: grid;
        width: 44px;
        min-width: 44px;
        place-items: center;
        background: #fff;
      }

      .primary:hover {
        background: var(--primary-hover);
      }

      .secondary:hover,
      .icon-button:hover {
        background: var(--secondary-hover);
      }

      .hero-word {
        display: grid;
        min-height: 190px;
        place-items: center;
        padding: 18px;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        background:
          radial-gradient(circle at top right, var(--primary-soft), transparent 12rem), #fff;
        text-align: center;
      }

      .hero-word span {
        display: block;
        color: var(--muted-foreground);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-word strong {
        display: block;
        margin-top: 10px;
        font-size: 3.35rem;
        line-height: 0.9;
        letter-spacing: 0;
      }

      .progress-strip {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 5px;
        margin-top: 12px;
      }

      .progress-cell {
        height: 7px;
        border-radius: 999px;
        background: #e5eaf2;
      }

      .progress-cell.done {
        background: var(--primary);
      }

      .assignment-card {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }

      .packet-mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 950;
      }

      .canvas-shell {
        display: flex;
        height: 100%;
        min-height: 0;
        flex-direction: column;
      }

      .draw-prompt {
        padding: 12px 16px;
        border-bottom: 1px solid var(--muted);
        background: #fff;
      }

      .draw-prompt strong {
        font-size: 1.35rem;
      }

      .tool-row {
        gap: 7px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--muted);
        background: #fff;
      }

      .swatch {
        width: 34px;
        height: 34px;
        border: 2px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--border);
      }

      .swatch.active {
        box-shadow: 0 0 0 3px var(--primary-soft);
      }

      .swatch.black {
        background: #111827;
      }

      .swatch.blue {
        background: #1f6feb;
      }

      .swatch.pink {
        background: #db2777;
      }

      .swatch.green {
        background: #16845c;
      }

      .brush-size {
        flex: 1;
        min-width: 80px;
      }

      .board-wrap {
        flex: 1;
        min-height: 0;
        padding: 10px;
        background:
          linear-gradient(#fff 23px, #edf1f6 24px), linear-gradient(90deg, #fff 23px, #edf1f6 24px);
        background-size: 24px 24px;
      }

      #drawCanvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 360px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.86);
        touch-action: none;
      }

      .waiting-hero {
        display: grid;
        gap: 12px;
        place-items: center;
        padding: 30px 14px;
        text-align: center;
      }

      .checkmark {
        display: grid;
        width: 70px;
        height: 70px;
        place-items: center;
        border-radius: 50%;
        background: var(--success-soft);
        color: var(--success);
        font-size: 1.2rem;
        font-weight: 950;
      }

      .pending-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .guess-image {
        display: grid;
        min-height: 330px;
        place-items: center;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        background: #fff;
      }

      .guess-image svg,
      .chain-drawing svg {
        width: 100%;
        height: 100%;
      }

      .guess-input {
        width: 100%;
        min-height: 58px;
        margin-top: 12px;
        padding: 0 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1.18rem;
        font-weight: 850;
      }

      .timer-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
      }

      .timer-card strong {
        font-size: 1.8rem;
        line-height: 1;
      }

      .timer-ring {
        display: grid;
        width: 54px;
        height: 54px;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(var(--primary) 0 62%, var(--muted) 62% 100%);
        animation: timer-pulse 1.8s ease-in-out infinite;
      }

      .timer-ring span {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        font-size: 0.78rem;
        font-weight: 900;
      }

      .chain {
        display: grid;
        gap: 10px;
      }

      .reveal-book {
        display: grid;
        min-height: 100%;
        align-content: stretch;
        gap: 12px;
      }

      .book-selector {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px;
        gap: 10px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
      }

      .book-name {
        display: inline-grid;
        grid-template-columns: auto minmax(0, max-content);
        gap: 10px;
        align-items: center;
        justify-content: center;
        min-width: 0;
        text-align: center;
      }

      .book-name strong,
      .book-name span {
        display: block;
      }

      .flip-card {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        min-height: 342px;
        gap: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background:
          radial-gradient(circle at top right, var(--primary-soft), transparent 11rem), #fff;
        text-align: center;
        box-shadow: 0 1px 2px hsl(220 18% 12% / 0.05);
      }

      .flip-reveal-area {
        display: grid;
        height: 240px;
        place-items: center;
        overflow: hidden;
      }

      .flip-card .chain-drawing {
        width: 100%;
        height: 240px;
        margin-top: 0;
      }

      .flip-word {
        display: grid;
        width: 100%;
        height: 240px;
        place-items: center;
        border-radius: 12px;
        background: var(--muted);
        font-size: 2rem;
        font-weight: 950;
        line-height: 1.05;
      }

      .reveal-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .share-panel {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
      }

      .chain-step {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 9px;
      }

      .chain-number {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: #eef2f7;
        font-size: 0.78rem;
        font-weight: 950;
      }

      .chain-card {
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }

      .chain-card strong {
        display: block;
        font-size: 0.82rem;
      }

      .chain-text {
        margin-top: 7px;
        padding: 12px;
        border-radius: 8px;
        background: var(--muted);
        font-size: 1.1rem;
        font-weight: 950;
      }

      .chain-drawing {
        height: 128px;
        margin-top: 7px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .stat {
        min-height: 86px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
      }

      .stat span {
        display: block;
        color: var(--muted-foreground);
        font-size: 0.72rem;
        font-weight: 850;
      }

      .stat strong {
        display: block;
        margin-top: 8px;
        font-size: 1.2rem;
        line-height: 1;
      }

      .packet-grid {
        display: grid;
        gap: 9px;
      }

      .packet-button {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-height: 62px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff;
        color: var(--foreground);
        text-align: left;
      }

      .packet-button:hover {
        background: var(--muted);
      }

      .packet-button .avatar {
        width: 42px;
        height: 42px;
      }

      .packet-button strong,
      .packet-button span {
        display: block;
      }

      .empty-state {
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 20px;
        text-align: center;
      }

      @keyframes timer-pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.035);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .timer-ring {
          animation: none;
        }
      }

      @media (max-width: 860px) {
        .prototype-shell {
          grid-template-columns: 1fr;
          width: min(100% - 20px, 430px);
          gap: 16px;
          padding-top: 12px;
        }

        .meta {
          position: static;
        }

        .screen-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .screen-button {
          grid-template-columns: 1fr;
        }

        .screen-index {
          display: none;
        }

        .phone {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell">
      <aside class="meta" aria-label="Prototype navigation">
        <p class="meta-kicker">DrawNGuess mobile prototype</p>
        <h1>Screen navigator</h1>
        <p class="meta-copy">
          Use these controls to jump between discrete mobile screens. The phone frame shows only the
          game UI a player or host would see.
        </p>

        <section class="meta-section">
          <span class="meta-label">Screen</span>
          <div class="screen-nav" id="screenNav"></div>
        </section>

        <section class="meta-section">
          <span class="meta-label">Viewer</span>
          <div class="role-grid" id="roleNav"></div>
        </section>

        <section class="notes" id="screenNotes"></section>
      </aside>

      <section class="phone-stage">
        <div class="screen-title" id="screenTitle"></div>
        <div class="phone" aria-label="Mobile viewport preview">
          <div class="phone-screen" id="phoneScreen"></div>
        </div>
      </section>
    </main>

    <script>
      const avatarIds = [
        "bear",
        "cat",
        "deer",
        "dog",
        "elephant",
        "fox",
        "frog",
        "hedgehog",
        "koala",
        "lion",
        "monkey",
        "owl",
        "panda",
        "penguin",
        "rabbit",
        "raccoon",
        "squirrel",
        "tiger",
        "turtle",
        "wolf",
      ];

      const players = [
        { id: "ari", name: "Ari", role: "Host", avatar: "frog" },
        { id: "bea", name: "Bea", role: "Player", avatar: "hedgehog" },
        { id: "cam", name: "Cam", role: "Player", avatar: "koala" },
        { id: "dee", name: "Dee", role: "Player", avatar: "lion" },
        { id: "eli", name: "Eli", role: "Player", avatar: "monkey" },
      ];

      const starterChains = {
        ari: {
          packet: "P1",
          word: "Rocket",
          color: "#0f766e",
          entries: [
            { by: "Deck", type: "Started", text: "Rocket" },
            { by: "Ari", type: "Drew", drawing: true, color: "#0f766e" },
            { by: "Bea", type: "Guessed", text: "Rocket ship" },
            { by: "Cam", type: "Drew", drawing: true, color: "#db2777" },
            { by: "Dee", type: "Guessed", text: "Space pencil" },
          ],
        },
        bea: {
          packet: "P2",
          word: "Pizza",
          color: "#b45309",
          entries: [
            { by: "Deck", type: "Started", text: "Pizza" },
            { by: "Bea", type: "Drew", drawing: true, color: "#b45309" },
            { by: "Cam", type: "Guessed", text: "Cheese wheel" },
            { by: "Dee", type: "Drew", drawing: true, color: "#0f766e" },
            { by: "Eli", type: "Guessed", text: "Moon snack" },
          ],
        },
        cam: {
          packet: "P3",
          word: "Castle",
          color: "#1f6feb",
          entries: [
            { by: "Deck", type: "Started", text: "Castle" },
            { by: "Cam", type: "Drew", drawing: true, color: "#1f6feb" },
            { by: "Dee", type: "Guessed", text: "Tiny palace" },
            { by: "Eli", type: "Drew", drawing: true, color: "#db2777" },
            { by: "Ari", type: "Guessed", text: "Birthday cake" },
          ],
        },
        dee: {
          packet: "P4",
          word: "Guitar",
          color: "#db2777",
          entries: [
            { by: "Deck", type: "Started", text: "Guitar" },
            { by: "Dee", type: "Drew", drawing: true, color: "#db2777" },
            { by: "Eli", type: "Guessed", text: "Banjo" },
            { by: "Ari", type: "Drew", drawing: true, color: "#b45309" },
            { by: "Bea", type: "Guessed", text: "Long spoon" },
          ],
        },
        eli: {
          packet: "P5",
          word: "Octopus",
          color: "#16845c",
          entries: [
            { by: "Deck", type: "Started", text: "Octopus" },
            { by: "Eli", type: "Drew", drawing: true, color: "#16845c" },
            { by: "Ari", type: "Guessed", text: "Sea monster" },
            { by: "Bea", type: "Drew", drawing: true, color: "#1f6feb" },
            { by: "Cam", type: "Guessed", text: "Angry umbrella" },
          ],
        },
      };

      const screens = [
        {
          id: "lobby-host",
          label: "Host lobby",
          title: "Host configures the round before play",
          note: "Host-only setup. This is still mobile-first, so options are compact rows and the start action stays in the sticky footer.",
        },
        {
          id: "lobby-player",
          label: "Player lobby",
          title: "Joined player waits for host",
          note: "Non-host view removes setup controls and emphasizes readiness plus room context.",
        },
        {
          id: "name-avatar",
          label: "Name + avatar",
          title: "Player chooses display name and avatar",
          note: "Avatar defaults randomly, then the player can pick a different one before joining.",
        },
        {
          id: "draw-brief",
          label: "Draw brief",
          title: "Player receives a private prompt",
          note: "Short pre-turn screen before the whiteboard. The prompt is private and should not leak to other players.",
        },
        {
          id: "custom-prompt",
          label: "Pick prompt",
          title: "Optional custom-prompt first turn",
          note: "Shown only when the room uses custom prompts. Each player writes the first word or phrase for their own packet, then the normal drawing/guessing rotation begins.",
        },
        {
          id: "draw-board",
          label: "Drawing",
          title: "Mobile whiteboard turn",
          note: "This screen is intentionally dense: prompt, tools, canvas, and submit must fit inside a phone without making the drawing area useless.",
        },
        {
          id: "draw-wait",
          label: "Draw waiting",
          title: "Submitted drawing waiting state",
          note: "After submit, the player sees progress only. Other players' content remains hidden.",
        },
        {
          id: "guess-turn",
          label: "Guessing",
          title: "Player guesses the previous drawing",
          note: "Guessing is text entry. The drawing is the main object; the footer action remains reachable.",
        },
        {
          id: "guess-wait",
          label: "Guess waiting",
          title: "Submitted guess waiting state",
          note: "Same waiting rhythm as drawing to keep multiplayer turns predictable.",
        },
        {
          id: "reveal",
          label: "Chain reveal",
          title: "Host-paced chain reveal",
          note: "Everyone sees the same reveal screen. The host advances one chain or step at a time.",
        },
        {
          id: "final",
          label: "Final gallery",
          title: "Round complete gallery",
          note: "No default score. The result is a replayable set of completed chains.",
        },
      ];

      const state = {
        screen: "lobby-host",
        viewer: "ari",
        color: "#111827",
        size: 7,
        drawing: false,
        revealStep: 0,
        exportStatus: "",
        promptMode: "predetermined",
        settingsCollapsed: false,
        selectedAvatar: avatarIds[Math.floor(Math.random() * avatarIds.length)],
      };

      const $ = (selector) => document.querySelector(selector);
      const $$ = (selector) => Array.from(document.querySelectorAll(selector));

      function viewer() {
        return players.find((player) => player.id === state.viewer) ?? players[0];
      }

      function isHost() {
        return state.viewer === "ari";
      }

      function initials(name) {
        return name.slice(0, 1).toUpperCase();
      }

      function avatarUrl(avatar) {
        return `assets/avatars/${avatar}.webp`;
      }

      function avatarMarkup(player, className = "") {
        return `<span class="avatar ${className}"><img src="${avatarUrl(player.avatar)}" alt="${player.name} avatar" /></span>`;
      }

      function currentChain() {
        return starterChains[state.viewer] ?? starterChains.ari;
      }

      function playerById(id) {
        return players.find((player) => player.id === id) ?? players[0];
      }

      function playerBookOffset(offset) {
        const currentIndex = players.findIndex((player) => player.id === state.viewer);
        const safeIndex = currentIndex >= 0 ? currentIndex : 0;
        return players[(safeIndex + offset + players.length) % players.length];
      }

      function shareIcon() {
        return `
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <path d="M8.6 10.8 15.4 6.2"></path>
            <path d="M8.6 13.2 15.4 17.8"></path>
          </svg>
        `;
      }

      function topbar(title, options = {}) {
        const modeChip = options.mode
          ? `<span class="chip ${options.modeClass ?? ""}">${options.mode}</span>`
          : `<span class="chip">DNG4</span>`;
        return `
          <header class="mobile-topbar">
            <div class="shell-header">
              <button class="home-button" type="button" title="Back to game picker">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                  <path d="m3 11 9-8 9 8"></path>
                  <path d="M5 10v10h14V10"></path>
                  <path d="M9 20v-6h6v6"></path>
                </svg>
              </button>
              <div class="header-title">
                <h1 class="mobile-title">${title}</h1>
                ${options.subtitle ? `<p class="mobile-subtitle">${options.subtitle}</p>` : ""}
              </div>
              <div>${modeChip}</div>
            </div>
            ${
              options.progress
                ? `<div class="progress-strip">${[0, 1, 2, 3, 4]
                    .map(
                      (index) =>
                        `<span class="progress-cell ${index < options.progress ? "done" : ""}"></span>`,
                    )
                    .join("")}</div>`
                : ""
            }
          </header>
        `;
      }

      function playerRows(activeIds = ["ari", "bea", "cam"]) {
        return players
          .map((player) => {
            const ready = activeIds.includes(player.id);
            return `
              <div class="player-row">
                ${avatarMarkup(player)}
                <span>
                  <span class="player-name">${player.name}</span>
                  <span class="player-meta">${player.role}</span>
                </span>
                <span class="chip ${ready ? "done" : ""}">${ready ? "Ready" : "Joining"}</span>
              </div>
            `;
          })
          .join("");
      }

      function footer(primary, secondary = "", danger = "") {
        return `
          <footer class="footer-actions">
            ${danger ? `<button class="danger" type="button">${danger}</button>` : ""}
            ${secondary ? `<button class="secondary" type="button">${secondary}</button>` : ""}
            <button class="primary" type="button">${primary}</button>
          </footer>
        `;
      }

      function avatarOptions() {
        return avatarIds
          .map(
            (avatar) => `
              <button class="avatar-option ${avatar === state.selectedAvatar ? "active" : ""}" type="button" data-avatar="${avatar}" title="${avatar}">
                <img src="${avatarUrl(avatar)}" alt="${avatar} avatar" />
              </button>
            `,
          )
          .join("");
      }

      function sampleDrawingSvg(label = "Rocket", color = "#1f6feb") {
        return `
          <svg viewBox="0 0 360 250" role="img" aria-label="Sample drawing">
            <rect width="360" height="250" fill="#fff" />
            <path d="M94 183 C138 70 198 173 242 72 C277 0 318 66 305 148" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" />
            <path d="M178 58 L245 125 L202 165 L134 98 Z" fill="#e8efff" stroke="#111827" stroke-width="7" />
            <path d="M134 98 L86 117 L112 139 Z" fill="#fce7f3" stroke="#111827" stroke-width="7" />
            <path d="M202 165 L192 213 L225 187 Z" fill="#fff1d6" stroke="#111827" stroke-width="7" />
            <circle cx="194" cy="109" r="17" fill="#fff" stroke="#111827" stroke-width="6" />
            <path d="M96 165 C65 179 53 207 51 224 C69 214 98 207 117 184" fill="#f97316" stroke="#111827" stroke-width="6" />
            <text x="180" y="236" text-anchor="middle" font-size="18" font-weight="900" fill="#111827">${label}</text>
          </svg>
        `;
      }

      function screenLobbyHost() {
        return `
          ${topbar("DrawNGuess", { subtitle: "Room lobby", mode: "DNG4" })}
          <section class="mobile-body stack">
            <div class="room-code">
              <div>
                <span class="subtle">Room code</span>
                <strong>DNG4</strong>
              </div>
            </div>
            <section class="panel">
              <div class="panel-inner">
                <h2>Players</h2>
                <div class="player-list">${playerRows()}</div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-inner">
                <button class="settings-toggle" type="button" data-toggle-settings>
                  <span>
                    <strong>Round setup</strong>
                    <span class="player-meta">${state.promptMode === "custom" ? "Custom prompts" : "Predetermined"} &middot; 60s draw &middot; 30s guess</span>
                  </span>
                  <span class="settings-chevron">${state.settingsCollapsed ? "+" : "-"}</span>
                </button>
                ${
                  state.settingsCollapsed
                    ? ""
                    : `
                      <div style="margin-top: 12px">
                        <strong>Starting prompts</strong>
                        <p class="subtle">Use the built-in list by default, or let each player write the first prompt for their own book.</p>
                        <div class="mode-toggle">
                          <button class="mode-option ${state.promptMode === "predetermined" ? "active" : ""}" type="button" data-prompt-mode="predetermined">
                            <strong>Predetermined</strong>
                            <span class="player-meta">Default word list</span>
                          </button>
                          <button class="mode-option ${state.promptMode === "custom" ? "active" : ""}" type="button" data-prompt-mode="custom">
                            <strong>Custom</strong>
                            <span class="player-meta">Players pick</span>
                          </button>
                        </div>
                      </div>
                      <div class="setting-row">
                        <span><strong>Draw timer</strong><br /><span class="player-meta">All players at once</span></span>
                        <span class="setting-value">60 sec</span>
                      </div>
                      <div class="setting-row">
                        <span><strong>Guess timer</strong><br /><span class="player-meta">Text entry turn</span></span>
                        <span class="setting-value">30 sec</span>
                      </div>
                    `
                }
              </div>
            </section>
          </section>
          ${footer("Start round", "Invite")}
        `;
      }

      function screenNameAvatar() {
        return `
          ${topbar("Join DrawNGuess", { subtitle: "Name and avatar", mode: "DNG4" })}
          <section class="mobile-body stack">
            <section class="panel">
              <div class="panel-inner">
                <div class="avatar-preview">
                  <span class="avatar"><img src="${avatarUrl(state.selectedAvatar)}" alt="Selected avatar" /></span>

                    <h2>Choose your look</h2>
                    <p class="subtle">A random avatar is picked first. Change it before joining if you want.</p>

            <button class="secondary" type="button" data-random-avatar>Random avatar</button>
            <button class="primary" type="button">Join room</button>
          </footer>
        `;

      function screenLobbyPlayer() {
        return `

              <div>
                <span class="subtle">Room code</span>
                <strong>DNG4</strong>
              </div>
            </div>
            <section class="panel">
              <div class="panel-inner">
                <h2>Players</h2>
                <div class="player-list">${playerRows()}</div>

            </section>
          </section>
          ${footer("Ready", "Leave")}
        `;
      }

      function screenDrawBrief() {
        const packetOwner = playerById("ari");
        return `
          ${topbar("Turn 1 of 5", {
            subtitle: "Packet from Ari",
            mode: "Draw",
            modeClass: "draw",
            progress: 1,
          })}

                <span>Draw this word</span>

              ${avatarMarkup(packetOwner, "assignment-avatar")}

                <strong>5 packets are moving</strong>
                <p class="subtle">Everyone is drawing a different starting word right now.</p>
              </div>
            </div>
            <section class="panel">
              <div class="panel-inner">
                <h2>Next</h2>
                <p class="subtle">When the timer starts, draw the word. The next player will only see your drawing.</p>
              </div>
            </section>
          </section>
          ${footer("Start drawing")}
        `;
      }

      function screenCustomPrompt() {
        const promptOwner = viewer();
        return `
          ${topbar("Turn 1 of 5", {
            subtitle: "Choose the first prompt",
            mode: "Prompt",
            progress: 1,
          })}
          <section class="mobile-body stack">
            <div class="timer-card">
              <div>
                <span class="player-meta">Prompt timer</span>
                <strong>00:45</strong>
                <p class="subtle">Your current text auto-submits when time runs out.</p>
              </div>
              <div class="timer-ring"><span>45</span></div>
            </div>
            <section class="panel">
              <div class="panel-inner">
                <h2>Pick a word or phrase</h2>
                <p class="subtle">Write something for the next player to draw. This becomes the original prompt for your book.</p>
                <input class="guess-input" id="promptInput" maxlength="42" placeholder="Type a prompt to pass on" value="" />
              </div>
            </section>
            <div class="assignment-card">
              ${avatarMarkup(promptOwner, "assignment-avatar")}
              <div>
                <strong>Your book starts here</strong>
                <p class="subtle">After this, DrawNGuess continues with drawing and guessing turns.</p>
              </div>
            </div>
          </section>
          ${footer("Submit prompt")}
        `;
      }

      function screenDrawBoard() {
        return `
          ${topbar("Turn 1 of 5", {
            subtitle: "00:42 remaining",
            mode: "Draw",
            modeClass: "draw",
            progress: 1,
          })}
          <section class="mobile-body no-pad">
            <div class="canvas-shell">
              <div class="draw-prompt">
                <span class="player-meta">Prompt</span><br />
                <strong>Rocket</strong>
              </div>
              <div class="tool-row" aria-label="Drawing tools">
                <button class="swatch black active" data-color="#111827" title="Black"></button>
                <button class="swatch blue" data-color="#1f6feb" title="Blue"></button>
                <button class="swatch pink" data-color="#db2777" title="Pink"></button>
                <button class="swatch green" data-color="#16845c" title="Green"></button>
                <input class="brush-size" id="brushSize" type="range" min="3" max="18" value="${state.size}" aria-label="Brush size" />
                <button class="icon-button" id="clearCanvas" type="button" title="Clear">C</button>
              </div>
              <div class="board-wrap">
                <canvas id="drawCanvas" width="720" height="900"></canvas>
              </div>
            </div>
          </section>
          ${footer("Submit drawing")}
        `;
      }

      function screenDrawWait() {
        return `
          ${topbar("Drawing sent", {
            subtitle: "Waiting for the table",
            mode: "Draw",
            modeClass: "draw",
            progress: 1,
          })}
          <section class="mobile-body stack">
            <div class="timer-card">
              <div>
                <p class="subtle">You can edit and resubmit before time expires.</p>
              </div>
              <div class="timer-ring"><span>37</span></div>
            </div>
            <section class="panel">
              <div class="waiting-hero">
                <span class="checkmark">OK</span>
                <div>
                  <h2>Your drawing is locked</h2>
                  <p class="subtle">The next player will guess it after everyone submits.</p>
                </div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-inner">
                <h2>Turn progress</h2>
                <div class="pending-list">
                  ${playerRows(["ari", "bea", "cam", "dee"])}
                </div>
              </div>
            </section>
          </section>
          <footer class="footer-actions">
            <button class="secondary" type="button" data-screen="draw-board">Edit drawing</button>
            <button class="primary" type="button">${isHost() ? "Advance when ready" : "Waiting..."}</button>
          </footer>
        `;
      }

      function screenGuessTurn() {
        return `
          ${topbar("Turn 2 of 5", {
            subtitle: "00:18 remaining",
            mode: "Guess",
            modeClass: "guess",
            progress: 2,
          })}
          <section class="mobile-body stack">
            <div class="timer-card">
              <div>
                <p class="subtle">Your current text auto-submits when time runs out.</p>
              </div>
              <div class="timer-ring"><span>18</span></div>
            </div>
            <div class="guess-image">${sampleDrawingSvg("", "#1f6feb")}</div>
            <section class="panel">
              <div class="panel-inner">
                <h2>What is this?</h2>
                <input class="guess-input" id="guessInput" maxlength="42" placeholder="Type a short guess" value="" />
              </div>
            </section>
          </section>
          ${footer("Submit guess")}
        `;
      }

      function screenGuessWait() {
        return `
          ${topbar("Guess sent", {
            subtitle: "Waiting for the next drawing turn",
            mode: "Guess",
            modeClass: "guess",
            progress: 2,
          })}
          <section class="mobile-body stack">
            <div class="timer-card">
              <div>
                <p class="subtle">You can edit and resubmit before time expires.</p>
              </div>
              <div class="timer-ring"><span>16</span></div>
            </div>
            <section class="panel">
              <div class="waiting-hero">
                <span class="checkmark">OK</span>
                <div>
                  <h2>You guessed "Rocket ship"</h2>
                  <p class="subtle">Someone else will draw your guess next.</p>
                </div>
              </div>
            </section>
            <section class="panel">
              <div class="panel-inner">
                <h2>Turn progress</h2>
                <div class="pending-list">
                  ${playerRows(["ari", "bea", "cam"])}
                </div>
              </div>
            </section>
          </section>
          <footer class="footer-actions">
            <button class="secondary" type="button" data-screen="guess-turn">Edit guess</button>
            <button class="primary" type="button">${isHost() ? "Advance when ready" : "Waiting..."}</button>
          </footer>
        `;
      }

      function chainMarkup(chain = currentChain()) {
        return chain.entries
          .map(
            (step, index) => `
              <div class="chain-step">
                <span class="chain-number">${index + 1}</span>
                <div class="chain-card">
                  <strong>${step.type} by ${step.by}</strong>
                  ${
                    step.drawing
                      ? `<div class="chain-drawing">${sampleDrawingSvg("", step.color)}</div>`
                      : `<div class="chain-text">${step.text}</div>`
                  }
                </div>
              </div>
            `,
          )
          .join("");
      }

      function revealLabel(step) {
        if (step.type === "Started") {
          return "Original prompt";
        }

        return `${step.type} by ${step.by}`;
      }

      function revealEntryMarkup(step) {
        if (step.drawing) {
          return `<div class="flip-reveal-area"><div class="chain-drawing">${sampleDrawingSvg("", step.color)}</div></div>`;
        }
        return `<div class="flip-reveal-area"><div class="flip-word">${step.text}</div></div>`;
      }

      function screenReveal() {
        const chain = currentChain();
        const step = chain.entries[state.revealStep] ?? chain.entries[0];
        const presenter = viewer();
        const previousPresenter = playerBookOffset(-1);
        const nextPresenter = playerBookOffset(1);
        return `
          ${topbar(`${chain.packet} reveal`, {
            subtitle: `${presenter.name}'s starting chain`,
            mode: "Present",
            progress: 5,
          })}
          <section class="mobile-body reveal-book">
            <p class="subtle" style="margin-top: 0; text-align: center;">Take turns presenting the responses to your Prompt.</p>
            <div class="book-selector">
              <button class="icon-button" type="button" data-player-book-prev title="${previousPresenter.name}'s book">&lt;</button>
              <div class="book-name">
                ${avatarMarkup(presenter, "book-avatar")}
                <span><strong>${presenter.name}</strong></span>
              </div>
              <button class="icon-button" type="button" data-player-book-next title="${nextPresenter.name}'s book">&gt;</button>
            </div>
            <article class="flip-card">
              <span class="chip">${state.revealStep + 1} of ${chain.entries.length}</span>
              <div>
                <span class="player-meta">${revealLabel(step)}</span>
                ${revealEntryMarkup(step)}
              </div>
            </article>
            <div class="reveal-controls">
              <button class="secondary" type="button" data-reveal-prev>Previous page</button>
              <button class="secondary" type="button" data-reveal-next>Next page</button>
            </div>
            <div class="share-panel">
              <button class="icon-button" type="button" data-export-chain title="Download chain image">${shareIcon()}</button>
              <span class="subtle">Share or download the full chain as one image.</span>
            </div>
            ${state.exportStatus ? `<p class="subtle">${state.exportStatus}</p>` : ""}
          </section>
          <footer class="footer-actions">
            <button class="primary" type="button" data-screen="final">Final gallery</button>
          </footer>
        `;
      }

      function packetButtons() {
        return Object.entries(starterChains)
          .map(([id, chain]) => {
            const player = playerById(id);
            const finalEntry = chain.entries[chain.entries.length - 1];
            return `
              <button class="packet-button" type="button" data-open-packet="${id}">
                ${avatarMarkup(player)}
                <span>
                  <strong>${player.name}'s starting chain</strong>
                  <span class="player-meta">${chain.word} -> ${finalEntry.text}</span>
                </span>
                <span class="chip">Open</span>
              </button>
            `;
          })
          .join("");
      }

      function screenFinal() {
        return `
          ${topbar("Round complete", { subtitle: "5 packets finished", mode: "Final", progress: 5 })}
          <section class="mobile-body stack">
            <section class="stat-grid">
              <div class="stat"><span>Chains</span><strong>5</strong></div>
              <div class="stat"><span>Drawings</span><strong>15</strong></div>
              <div class="stat"><span>Guesses</span><strong>10</strong></div>
            </section>
            <section class="panel">
              <div class="panel-inner">
                <h2>Answer packets</h2>
                <p class="subtle">Open any finished chain for replay, export, or passing the phone to the presenter.</p>
                <div class="packet-grid" style="margin-top: 12px">${packetButtons()}</div>
              </div>
            </section>
          </section>
          <footer class="footer-actions">
            <button class="primary" type="button">Pick a new game</button>
            <button class="primary" type="button">Play again</button>
          </footer>
        `;
      }

      const renderers = {
        "lobby-host": screenLobbyHost,
        "lobby-player": screenLobbyPlayer,
        "name-avatar": screenNameAvatar,
        "draw-brief": screenDrawBrief,
        "custom-prompt": screenCustomPrompt,
        "draw-board": screenDrawBoard,
        "draw-wait": screenDrawWait,
        "guess-turn": screenGuessTurn,
        "guess-wait": screenGuessWait,
        reveal: screenReveal,
        final: screenFinal,
      };

      function renderMeta() {
        $("#screenNav").innerHTML = screens
          .map(
            (screen, index) => `
              <button class="screen-button ${screen.id === state.screen ? "active" : ""}" data-screen="${screen.id}" type="button">
                <span class="screen-index">${index + 1}</span>
                <span>${screen.label}</span>
              </button>
            `,
          )
          .join("");

        $("#roleNav").innerHTML = players
          .slice(0, 3)
          .map(
            (player) => `
              <button class="role-button ${player.id === state.viewer ? "active" : ""}" data-viewer="${player.id}" type="button">
                ${player.name}
              </button>
            `,
          )
          .join("");

        const current = screens.find((screen) => screen.id === state.screen) ?? screens[0];
        $("#screenTitle").textContent = current.title;
        $("#screenNotes").innerHTML =
          `<strong>${current.label}</strong><span>${current.note}</span>`;
      }

      function renderPhone() {
        const renderer = renderers[state.screen] ?? screenLobbyHost;
        $("#phoneScreen").innerHTML = renderer();
        if (state.screen === "draw-board") {
          setupCanvas();
        }
      }

      function render() {
        renderMeta();
        renderPhone();
      }

      function setupCanvas() {
        const canvas = $("#drawCanvas");
        const context = canvas.getContext("2d");
        context.lineCap = "round";
        context.lineJoin = "round";
        let drawing = false;

        function point(event) {
          const rect = canvas.getBoundingClientRect();
          return {
            x: ((event.clientX - rect.left) / rect.width) * canvas.width,
            y: ((event.clientY - rect.top) / rect.height) * canvas.height,
          };
        }

        function start(event) {
          drawing = true;
          const next = point(event);
          context.beginPath();
          context.moveTo(next.x, next.y);
        }

        function move(event) {
          if (!drawing) return;
          const next = point(event);
          context.lineWidth = state.size;
          context.strokeStyle = state.color;
          context.lineTo(next.x, next.y);
          context.stroke();
        }

        function stop() {
          drawing = false;
        }

        canvas.addEventListener("pointerdown", start);
        canvas.addEventListener("pointermove", move);
        canvas.addEventListener("pointerup", stop);
        canvas.addEventListener("pointerleave", stop);

        $$(".swatch").forEach((button) => {
          button.addEventListener("click", () => {
            state.color = button.dataset.color;
            $$(".swatch").forEach((swatch) => swatch.classList.remove("active"));
            button.classList.add("active");
          });
        });

        $("#brushSize").addEventListener("input", (event) => {
          state.size = Number(event.target.value);
        });

        $("#clearCanvas").addEventListener("click", () => {
          context.clearRect(0, 0, canvas.width, canvas.height);
        });
      }

      function drawWrappedText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(" ");
        let line = "";
        let nextY = y;

        words.forEach((word) => {
          const testLine = line ? `${line} ${word}` : word;
          if (context.measureText(testLine).width > maxWidth && line) {
            context.fillText(line, x, nextY);
            line = word;
            nextY += lineHeight;
          } else {
            line = testLine;
          }
        });

        context.fillText(line, x, nextY);
        return nextY + lineHeight;
      }

      function drawExportSketch(context, x, y, width, height, color) {
        context.save();
        context.fillStyle = "#ffffff";
        context.strokeStyle = "#d7dde8";
        context.lineWidth = 4;
        context.beginPath();
        context.roundRect(x, y, width, height, 18);
        context.fill();
        context.stroke();

        context.strokeStyle = color;
        context.lineWidth = 12;
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(x + 80, y + height - 62);
        context.bezierCurveTo(x + 150, y + 30, x + 245, y + height - 78, x + 330, y + 52);
        context.bezierCurveTo(x + 430, y - 10, x + 520, y + 75, x + 500, y + height - 70);
        context.stroke();

        context.strokeStyle = "#111827";
        context.fillStyle = "#e6f4f1";
        context.lineWidth = 7;
        context.beginPath();
        context.roundRect(x + width / 2 - 105, y + 46, 210, 126, 18);
        context.fill();
        context.stroke();
        context.restore();
      }

      function buildChainExportCanvas(chain) {
        const canvas = document.createElement("canvas");
        const width = 1200;
        const rowHeight = 230;
        const height = 180 + chain.entries.length * rowHeight;
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");

        context.fillStyle = "#f8f5ef";
        context.fillRect(0, 0, width, height);
        context.fillStyle = "#111827";
        context.font = "900 56px system-ui, sans-serif";
        context.fillText(`DrawNGuess ${chain.packet}`, 70, 82);
        context.font = "700 28px system-ui, sans-serif";
        context.fillStyle = "#667085";
        context.fillText(`Starting word: ${chain.word}`, 72, 126);

        chain.entries.forEach((entry, index) => {
          const top = 170 + index * rowHeight;
          context.fillStyle = "#ffffff";
          context.strokeStyle = "#d7dde8";
          context.lineWidth = 3;
          context.beginPath();
          context.roundRect(70, top, width - 140, rowHeight - 28, 22);
          context.fill();
          context.stroke();

          context.fillStyle = "#0f766e";
          context.font = "900 28px system-ui, sans-serif";
          context.fillText(`${index + 1}. ${entry.type} by ${entry.by}`, 110, top + 48);

          if (entry.drawing) {
            drawExportSketch(context, 110, top + 70, width - 220, 112, entry.color);
          } else {
            context.fillStyle = "#111827";
            context.font = "900 42px system-ui, sans-serif";
            drawWrappedText(context, entry.text, 110, top + 118, width - 220, 50);
          }
        });

        return canvas;
      }

      async function exportCurrentChain() {
        const chain = currentChain();
        const canvas = buildChainExportCanvas(chain);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        const fileName = `drawnguess-${chain.packet.toLowerCase()}-${chain.word.toLowerCase()}.png`;

        if (blob && navigator.share && navigator.canShare) {
          const file = new File([blob], fileName, { type: "image/png" });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({
              files: [file],
              title: `DrawNGuess ${chain.packet}`,
              text: `${chain.word} chain`,
            });
            state.exportStatus = "Share sheet opened for the full chain image.";
            render();
            return;
          }
        }

        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = fileName;
        link.click();
        state.exportStatus = "Downloaded the full chain image.";
        render();
      }

      document.addEventListener("click", (event) => {
        const avatarButton = event.target.closest("[data-avatar]");
        if (avatarButton) {
          state.selectedAvatar = avatarButton.dataset.avatar;
          render();
          return;
        }

        const randomAvatarButton = event.target.closest("[data-random-avatar]");
        if (randomAvatarButton) {
          const currentIndex = avatarIds.indexOf(state.selectedAvatar);
          const nextIndex = (currentIndex + 7) % avatarIds.length;
          state.selectedAvatar = avatarIds[nextIndex];
          render();
          return;
        }

        const settingsToggle = event.target.closest("[data-toggle-settings]");
        if (settingsToggle) {
          state.settingsCollapsed = !state.settingsCollapsed;
          render();
          return;
        }

        const promptModeButton = event.target.closest("[data-prompt-mode]");
        if (promptModeButton) {
          state.promptMode = promptModeButton.dataset.promptMode;
          render();
          return;
        }

        const previousBook = event.target.closest("[data-player-book-prev]");
        if (previousBook) {
          state.viewer = playerBookOffset(-1).id;
          state.revealStep = 0;
          state.exportStatus = "";
          render();
          return;
        }

        const nextBook = event.target.closest("[data-player-book-next]");
        if (nextBook) {
          state.viewer = playerBookOffset(1).id;
          state.revealStep = 0;
          state.exportStatus = "";
          render();
          return;
        }

        const nextPresenter = event.target.closest("[data-next-presenter]");
        if (nextPresenter) {
          const currentIndex = players.findIndex((player) => player.id === state.viewer);
          const nextIndex = currentIndex >= 0 ? (currentIndex + 1) % players.length : 0;
          state.viewer = players[nextIndex].id;
          state.revealStep = 0;
          state.exportStatus = "";
          render();
          return;
        }

        const revealNext = event.target.closest("[data-reveal-next]");
        if (revealNext) {
          const chain = currentChain();
          state.revealStep = Math.min(state.revealStep + 1, chain.entries.length - 1);
          state.exportStatus = "";
          render();
          return;
        }

        const revealPrevious = event.target.closest("[data-reveal-prev]");
        if (revealPrevious) {
          state.revealStep = Math.max(state.revealStep - 1, 0);
          state.exportStatus = "";
          render();
          return;
        }

        const revealReset = event.target.closest("[data-reveal-reset]");
        if (revealReset) {
          state.revealStep = 0;
          state.exportStatus = "";
          render();
          return;
        }

        const exportButton = event.target.closest("[data-export-chain]");
        if (exportButton) {
          exportCurrentChain().catch(() => {
            state.exportStatus = "Export failed in this browser context.";
            render();
          });
          return;
        }

        const packetButton = event.target.closest("[data-open-packet]");
        if (packetButton) {
          state.viewer = packetButton.dataset.openPacket;
          state.screen = "reveal";
          state.revealStep = 0;
          state.exportStatus = "";
          render();
          return;
        }

        const screenButton = event.target.closest("[data-screen]");
        if (screenButton) {
          state.screen = screenButton.dataset.screen;
          if (state.screen === "reveal") {
            state.revealStep = 0;
          }
          state.exportStatus = "";
          render();
          return;
        }

        const roleButton = event.target.closest("[data-viewer]");
        if (roleButton) {
          state.viewer = roleButton.dataset.viewer;
          state.revealStep = 0;
          state.exportStatus = "";
          render();
        }
      });

      render();
    </script>
  </body>
</html>
