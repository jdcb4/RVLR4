apply plugin: 'com.android.application'

// Secrets are supplied only to the build process; never commit a signing identity.
def unsignedRelease = providers.gradleProperty('rvlryUnsignedRelease').orNull == 'true'
def signingEnv = ['RVLRY_UPLOAD_STORE_FILE', 'RVLRY_UPLOAD_STORE_PASSWORD', 'RVLRY_UPLOAD_KEY_ALIAS', 'RVLRY_UPLOAD_KEY_PASSWORD']
def signingReady = signingEnv.every { System.getenv(it)?.trim() }
if (signingReady && !unsignedRelease && !new File(System.getenv('RVLRY_UPLOAD_STORE_FILE')).isAbsolute()) {
    throw new GradleException('RVLRY_UPLOAD_STORE_FILE must be an absolute path. The build helper resolves relative paths before invoking Gradle.')
}
def releasePackagingTasks = ['bundleRelease', 'assembleRelease', 'packageRelease', 'packageReleaseBundle']
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && releasePackagingTasks.contains(it.name) }) {
        if (!unsignedRelease && !signingReady) {
            throw new GradleException('Release signing is not configured. Supply all RVLRY_UPLOAD_* variables, or use the explicit unsigned preparation command. No debug-key fallback is allowed.')
        }
    }
}


android {
    namespace = "au.joed.rvlry"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "au.joed.rvlry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "0.43.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady && !unsignedRelease) {
            upload {
                storeFile file(System.getenv('RVLRY_UPLOAD_STORE_FILE'))
                storePassword System.getenv('RVLRY_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('RVLRY_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('RVLRY_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (signingReady && !unsignedRelease) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
